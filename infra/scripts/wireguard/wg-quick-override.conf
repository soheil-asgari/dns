# ============================================================
# systemd override — auto-restart wg-quick@wg0 on failure
# Place at:
#   /etc/systemd/system/wg-quick@wg0.service.d/override.conf
# ============================================================
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10s