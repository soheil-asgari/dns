server:
    verbosity: 1
    interface: 10.10.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Only allow queries from the WireGuard tunnel network and loopback.
    access-control: 10.10.0.0/24 allow
    access-control: 127.0.0.0/8 allow

    # Recursive resolution from root hints — no forwarding.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    module-config: "validator iterator"
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    hide-identity: yes
    hide-version: yes
    prefetch: yes
    serve-expired: yes
    cache-max-ttl: 86400
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"