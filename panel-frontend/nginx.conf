# RhynoAI panel frontend.
#
# Traffic reaches this container directly from HAProxy (no CDN in front):
#   * port 80  -> internal HTTP used by the HAProxy port-80 frontend; redirects
#                 everything except the health probe to HTTPS.
#   * port 8443 -> public HTTPS endpoint for dns.rhynoai.ir. HAProxy forwards
#                 the TLS connection via SNI passthrough and prepends a PROXY
#                 protocol v2 header, so the real client IP is recovered here.
#
# Externally, TLS is exposed on 443 by HAProxy (SNI dns.rhynoai.ir -> 8443).

# Trust HAProxy on the Docker bridge network and recover the real client IP
# from the PROXY protocol header it prepends to each passthrough connection.
set_real_ip_from 172.16.0.0/12;
real_ip_header proxy_protocol;

server {
    listen 80;
    server_name dns.rhynoai.ir localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Health probe for HAProxy (must return 200, never a redirect).
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Everything else on plain HTTP is upgraded to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl proxy_protocol;
    server_name dns.rhynoai.ir;

    ssl_certificate     /etc/letsencrypt/live/dns.rhynoai.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns.rhynoai.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # IP Registration Page (static HTML)
    location = /ip {
        default_type text/html;
        try_files /ip.html /index.html =404;
    }

    # Admin Panel SPA
    location /panel {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend using standard real-IP forwarding headers.
    # Resolve the backend through Docker's embedded DNS at request time (via a
    # variable) so a recreated backend-api with a new container IP does not
    # leave Nginx pointing at a stale, dead upstream.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend-api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
