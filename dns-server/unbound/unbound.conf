server:
    num-threads: 4
    so-reuseport: yes
    msg-cache-size: 64m
    rrset-cache-size: 128m
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Only containers on this Compose network (and loopback) may query Unbound.
    access-control: 127.0.0.0/8 allow
    access-control: 172.20.0.0/16 allow

    # No forward-zone is configured: Unbound resolves iteratively from root hints.
    # The root trust anchor is initialized by unbound-anchor at container startup.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    module-config: "validator iterator"
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    hide-identity: yes
    hide-version: yes
    prefetch: yes
    serve-expired: yes
    cache-max-ttl: 86400
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
