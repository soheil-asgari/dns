global
    log         /dev/log local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4096
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    log                     global
    option                  httplog
    option                  dontlognull
    option                  redispatch
    retries                 3
    maxconn                 2000
    timeout connect         5000ms
    timeout client          50000ms
    timeout server          50000ms
    timeout http-request    10s
    timeout queue           1m

#---------------------------------------------------------------------
# Frontend: API Gateway (HTTP/HTTPS)
#---------------------------------------------------------------------
frontend api_gateway
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/haproxy.pem
    mode http
    
    # ACLs for routing
    acl is_api         path_beg /api
    acl is_panel       path_beg /panel
    acl is_ws          path_beg /ws
    acl is_webhook     path_beg /bot
    
    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    
    # Routing rules
    use_backend backend_api if is_api
    use_backend panel_frontend if is_panel
    use_backend websocket_servers if is_ws
    use_backend telegram_bot if is_webhook
    
    default_backend backend_api

#---------------------------------------------------------------------
# Frontend: DNS over HTTPS (DoH)
#---------------------------------------------------------------------
frontend dns_over_https
    bind *:8053 ssl crt /etc/ssl/certs/haproxy.pem
    mode http
    use_backend dns_servers

#---------------------------------------------------------------------
# Backend: API Servers
#---------------------------------------------------------------------
backend backend_api
    mode http
    balance roundrobin
    
    # Health check
    option httpchk GET /health
    http-check expect status 200
    
    server api1 backend-api:8080 check inter 5s fall 3 rise 2 weight 10
    server api2 backend-api:8081 check inter 5s fall 3 rise 2 weight 10 backup

#---------------------------------------------------------------------
# Backend: Panel Frontend
#---------------------------------------------------------------------
backend panel_frontend
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    
    server panel panel-frontend:3000 check inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# Backend: WebSocket Servers
#---------------------------------------------------------------------
backend websocket_servers
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    timeout tunnel 3600s
    
    server ws1 backend-api:8080 check inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# Backend: Telegram Bot
#---------------------------------------------------------------------
backend telegram_bot
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    server bot telegram-bot:5000 check inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# Backend: DNS Servers
#---------------------------------------------------------------------
backend dns_servers
    mode http
    balance roundrobin
    server dns1 dns-server:53 check inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# Statistics
#---------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats auth admin:password123
