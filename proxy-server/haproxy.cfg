global
    log         stdout format raw local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     10000
    nbthread    4
    user        haproxy
    group       haproxy
    daemon
    stats socket /usr/local/etc/haproxy/admin.sock mode 660 level admin
    tune.bufsize 16384
    tune.ssl.cachesize 50000

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    log                     global
    option                  dontlognull
    option                  redispatch
    retries                 3
    maxconn                 2000
    timeout connect         2000ms
    timeout client          30000ms
    timeout server          30000ms
    timeout http-keep-alive 10s

#---------------------------------------------------------------------
# Frontend: Gaming SNI Passthrough (Port 443)
# Priority routing for known gaming titles via SNI
#---------------------------------------------------------------------
frontend gaming_sni
    bind *:443
    mode tcp
    option tcplog
    tcp-request inspect-delay 2s
    tcp-request content accept if { req_ssl_hello_type 1 }
    timeout client 1h
    timeout client-fin 30s

    # Known gaming SNI patterns
    acl is_valorant   req_ssl_sni -m end .valorant.com
    acl is_league     req_ssl_sni -m end .leagueoflegends.com
    acl is_fortnite   req_ssl_sni -m end .fortnite.com
    acl is_epic       req_ssl_sni -m end .epicgames.com
    acl is_steam      req_ssl_sni -m end .steampowered.com
    acl is_steam_cdn  req_ssl_sni -m end .steamcontent.com
    acl is_riot       req_ssl_sni -m end .riotgames.com
    acl is_blizzard   req_ssl_sni -m end .battle.net
    acl is_ubisoft    req_ssl_sni -m end .ubisoft.com
    acl is_electronic req_ssl_sni -m end .ea.com
    acl is_microsoft  req_ssl_sni -m end .xboxlive.com
    acl is_playstation req_ssl_sni -m end .playstation.com
    acl is_nintendo   req_ssl_sni -m end .nintendo.net

    use_backend gaming_priority if is_valorant or is_league or is_fortnite or is_epic or is_steam or is_steam_cdn or is_riot or is_blizzard or is_ubisoft or is_electronic or is_microsoft or is_playstation or is_nintendo
    default_backend backend_germany_sni

#---------------------------------------------------------------------
# Backend: Gaming Priority (leastconn, faster health checks)
#---------------------------------------------------------------------
backend gaming_priority
    mode tcp
    option tcpka
    timeout server 1h
    timeout tunnel 1h
    timeout check 2s
    balance leastconn
    server germany_peer 10.10.0.1:443 check inter 1s fall 2 rise 1 weight 20

#---------------------------------------------------------------------
# Backend: General Germany SNI Passthrough
#---------------------------------------------------------------------
backend backend_germany_sni
    mode tcp
    option tcpka
    timeout check 5s
    timeout server 1h
    timeout tunnel 1h
    balance leastconn
    server germany_peer 10.10.0.1:443 check inter 2s fall 3 rise 2 weight 10

#---------------------------------------------------------------------
# Frontend: DNS RhynoAI Domain (Port 80)
#---------------------------------------------------------------------
frontend dns_rhynoai
    bind *:80
    mode http
    option httplog
    
    acl is_dns_domain   hdr(host) -i dns.rhynoai.ir
    acl is_dns_portal   hdr(host) -i dns.rhynoai.ir
    
    acl is_api          path_beg /api
    acl is_ip_page      path_beg /ip
    acl is_panel        path_beg /panel
    acl is_ws           path_beg /ws
    acl is_webhook      path_beg /bot
    
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    
    # Handle CORS preflight (OPTIONS) directly to avoid ArvanCloud 504 timeout
    acl is_options      method OPTIONS
    http-request return status 204 hdr Access-Control-Allow-Origin * hdr Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" hdr Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" hdr Access-Control-Max-Age 86400 if is_options
    
    use_backend backend_api if is_api
    use_backend panel_frontend_backend if is_dns_portal
    use_backend panel_frontend_backend if is_ip_page
    use_backend panel_frontend_backend if is_panel
    use_backend websocket_servers if is_ws
    use_backend telegram_bot if is_webhook
    
    # Route non-DNS traffic (gaming patch downloads) via SSL to Germany
    use_backend backend_germany_http_as_https if !is_dns_domain
    
    default_backend panel_frontend_backend

#---------------------------------------------------------------------
# Legacy frontend (backward compat)
#---------------------------------------------------------------------
frontend api_gateway
    bind *:8080
    mode http
    option httplog
    
    acl is_api          path_beg /api
    acl is_ws           path_beg /ws
    acl is_webhook      path_beg /bot
    
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    
    use_backend backend_api if is_api
    use_backend websocket_servers if is_ws
    use_backend telegram_bot if is_webhook
    
    default_backend backend_api

#---------------------------------------------------------------------
# Frontend: DNS over HTTPS (DoH)
#---------------------------------------------------------------------
frontend dns_over_https
    bind *:8053 ssl crt /etc/ssl/certs/haproxy.pem
    mode http
    use_backend dns_servers

#---------------------------------------------------------------------
# Backends
#---------------------------------------------------------------------
backend backend_api
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server api1 backend-api:8080 check resolvers docker init-addr last,libc,none inter 5s fall 3 rise 2 weight 10
    server api2 backend-api:8081 check resolvers docker init-addr last,libc,none inter 5s fall 3 rise 2 weight 10 backup

backend panel_frontend_backend
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server panel panel-frontend:80 check resolvers docker init-addr last,libc,none inter 5s fall 3 rise 2

backend websocket_servers
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    timeout tunnel 3600s
    server ws1 backend-api:8080 check resolvers docker init-addr last,libc,none inter 5s fall 3 rise 2

backend telegram_bot
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server bot telegram-bot:5000 check resolvers docker init-addr last,libc,none inter 5s fall 3 rise 2

backend dns_servers
    mode http
    balance roundrobin
    server dns1 coredns:53 check resolvers docker init-addr last,libc,none inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# Backend: HTTP port 80 traffic forwarded as HTTPS to Germany
#---------------------------------------------------------------------
backend backend_germany_http_as_https
    mode http
    timeout server 1h
    timeout tunnel 1h
    http-request set-header Host %[req.hdr(host)]
    server germany_ssl 10.10.0.1:443 ssl verify none sni req.hdr(host),field(1,:) resolvers docker init-addr last,libc,none

#---------------------------------------------------------------------
# Statistics
#---------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats auth admin:password123

