global
    log         stdout format raw local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4096
    user        haproxy
    group       haproxy
    daemon
    # Admin socket in shared volume so backend-api can reach it
    stats socket /usr/local/etc/haproxy/admin.sock mode 660 level admin

defaults
    log                     global
    option                  dontlognull
    option                  redispatch
    retries                 3
    maxconn                 2000
    timeout connect         5000ms
    timeout client          50000ms
    timeout server          50000ms

#---------------------------------------------------------------------
# Frontend: Port 443 (TCP Passthrough for Gaming to Germany)
# IP whitelist enforced at tcp-request connection level.
# Only IPs present in whitelist.acl (synced from Redis) are allowed.
#---------------------------------------------------------------------
frontend https_sni_passthrough
    bind *:443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    acl is_allowed_ip src -f /usr/local/etc/haproxy/whitelist.acl
    tcp-request connection reject if !is_allowed_ip
    tcp-request content accept if { req_ssl_hello_type 1 }
    timeout client 1h
    timeout client-fin 30s
    default_backend backend_germany_sni

backend backend_germany_sni
    mode tcp
    timeout check 10s
    timeout server 1h
    timeout tunnel 1h
    server germany_peer 10.10.0.1:443 check inter 5s fall 5 rise 2

#---------------------------------------------------------------------
# Frontend: DNS RhynoAI Domain (Port 80 & 443)
#---------------------------------------------------------------------
frontend dns_rhynoai
    bind *:80
    mode http
    option httplog
    
    # SNI-based routing (ArvanCloud CDN sends traffic for dns.rhynoai.ir)
    acl is_dns_domain   hdr(host) -i dns.rhynoai.ir
    acl is_dns_portal   hdr(host) -i dns.rhynoai.ir
    
    # ACLs for path-based routing
    acl is_api         path_beg /api
    acl is_ip_page     path_beg /ip
    acl is_panel       path_beg /panel
    acl is_ws          path_beg /ws
    acl is_webhook     path_beg /bot
    
    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    
    # Routing rules
    use_backend backend_api if is_api
    use_backend panel_frontend_backend if is_dns_portal
    use_backend panel_frontend_backend if is_ip_page
    use_backend panel_frontend_backend if is_panel
    use_backend websocket_servers if is_ws
    use_backend telegram_bot if is_webhook
    
    # Route non-DNS traffic (gaming patch downloads) via SSL to Germany
    use_backend backend_germany_http_as_https if !is_dns_domain
    
    default_backend panel_frontend_backend

#---------------------------------------------------------------------
# Legacy frontend (backward compat)
#---------------------------------------------------------------------
frontend api_gateway
    bind *:8080
    mode http
    option httplog
    
    acl is_api         path_beg /api
    acl is_ws          path_beg /ws
    acl is_webhook     path_beg /bot
    
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    
    use_backend backend_api if is_api
    use_backend websocket_servers if is_ws
    use_backend telegram_bot if is_webhook
    
    default_backend backend_api

#---------------------------------------------------------------------
# Frontend: DNS over HTTPS (DoH)
#---------------------------------------------------------------------
frontend dns_over_https
    bind *:8053 ssl crt /etc/ssl/certs/haproxy.pem
    mode http
    use_backend dns_servers

#---------------------------------------------------------------------
# Backends
#---------------------------------------------------------------------
backend backend_api
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server api1 backend-api:8080 check inter 5s fall 3 rise 2 weight 10
    server api2 backend-api:8081 check inter 5s fall 3 rise 2 weight 10 backup

backend panel_frontend_backend
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server panel panel-frontend:80 check inter 5s fall 3 rise 2

backend websocket_servers
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    timeout tunnel 3600s
    server ws1 backend-api:8080 check inter 5s fall 3 rise 2

backend telegram_bot
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server bot telegram-bot:5000 check inter 5s fall 3 rise 2

backend dns_servers
    mode http
    balance roundrobin
    server dns1 coredns:53 check inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# Backend: HTTP port 80 traffic forwarded as HTTPS to Germany
#---------------------------------------------------------------------
backend backend_germany_http_as_https
    mode http
    timeout server 1h
    timeout tunnel 1h
    http-request set-header Host %[req.hdr(host)]
    server germany_ssl 10.10.0.1:443 ssl verify none sni req.hdr(host),field(1,:)

#---------------------------------------------------------------------
# Statistics
#---------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats auth admin:password123
